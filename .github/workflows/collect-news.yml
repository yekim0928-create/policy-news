name: Collect News

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Collect RSS news
        run: npm run collect

      - name: Commit and push if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          if git diff --quiet -- data/news.json; then
            echo "No changes in data/news.json, skipping commit."
          else
            git add data/news.json
            git commit -m "chore: update news data"
            git push
          fi
